<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Quest</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    background:#06111f;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;
    background-image:url("assets/images/background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    filter:brightness(.85) contrast(1.08) saturate(1.05);
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;
    background:linear-gradient(rgba(0,0,0,.12), rgba(0,0,0,.35));
}

.blink{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(70px);
    opacity:0;
    pointer-events:none;
    z-index:-2;
}

.blink1{
    top:10%;
    left:10%;
    background:rgba(56,189,248,.55);
    animation:blinkMove 4s infinite;
}

.blink2{
    right:10%;
    bottom:10%;
    background:rgba(37,99,235,.50);
    animation:blinkMove 4s infinite 1.5s;
}

.blink3{
    left:45%;
    bottom:18%;
    background:rgba(255,255,255,.18);
    animation:blinkMove 4s infinite 3s;
}

.menu{
    width:90%;
    max-width:440px;
    text-align:center;
    padding:40px 30px;
    border:1px solid rgba(255, 255, 255, 0.18);
    border-radius:24px;
    background:rgba(6, 14, 28, 0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    box-shadow:0 25px 70px rgba(0,0,0,0.6);
}

.title{
    font-size:clamp(34px,5vw,46px);
    font-weight:900;
    letter-spacing:4px;
    margin-bottom:35px;
    text-transform:uppercase;
    text-shadow:
    0 0 10px rgba(255,255,255,.9),
    0 0 25px rgba(56,189,248,.9),
    0 0 45px rgba(37,99,235,.7);
    animation:titleBlink 1.8s ease-in-out infinite;
}

.button-group{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:15px;
}

.btn{
    width:100%;
    padding:13px 20px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    background:linear-gradient(135deg, #38bdf8, #2563eb);
    color:white;
    font-size:17px;
    font-weight:900;
    letter-spacing:2px;
    box-shadow:
    0 12px 25px rgba(0,0,0,.35),
    0 0 18px rgba(56,189,248,.45);
    transition:.2s ease;
}

.btn:hover{
    transform:translateY(-3px) scale(1.03);
    filter:brightness(1.15);
    box-shadow:
    0 16px 35px rgba(0,0,0,.45),
    0 0 25px rgba(56,189,248,.7);
}

.btn:active{
    transform:scale(.97);
}

@keyframes blinkMove{
    0%{ opacity:0; transform:scale(.8); }
    50%{ opacity:1; transform:scale(1.2); }
    100%{ opacity:0; transform:scale(.8); }
}

@keyframes titleBlink{
    0%,100%{ opacity:1; filter:brightness(1); }
    50%{ opacity:.82; filter:brightness(1.3); }
}
</style>
</head>

<body>

<div class="blink blink1"></div>
<div class="blink blink2"></div>
<div class="blink blink3"></div>

<main class="menu">
    <h1 class="title">MAZE QUEST</h1>
    <div class="button-group">
        <button class="btn" onclick="clickGo('level.html')">PLAY</button>
        <button class="btn" onclick="clickGo('highscores.html')">HIGH SCORES</button>
        <button class="btn" onclick="clickGo('settings.html')">SETTINGS</button>
    </div>
</main>

<audio id="bgm" loop preload="auto" src="assets/audio/backgroundmusic.mp3"></audio>
<audio id="click" preload="auto" src="assets/audio/kliktombol.mp3"></audio>

<script>
const nav = performance.getEntriesByType("navigation")[0];
if(nav && nav.type === "reload"){
    window.location.replace("loading.html");
}

const VOLUME_KEY = "mazeVolume";

function getVolume(){
    return parseFloat(localStorage.getItem(VOLUME_KEY) || "0.75");
}

function setupAudio(){
    const bgm = document.getElementById("bgm");
    const click = document.getElementById("click");

    bgm.volume = getVolume();
    click.volume = getVolume();

    // Paksa mainkan lagu latar belakang saat user berinteraksi dengan halaman ini
    const forcePlay = () => {
        bgm.play().catch(() => {});
        document.removeEventListener("pointerdown", forcePlay);
        document.removeEventListener("keydown", forcePlay);
    };
    document.addEventListener("pointerdown", forcePlay);
    document.addEventListener("keydown", forcePlay);
}

function clickGo(url){
    const click = document.getElementById("click");
    click.volume = getVolume();
    click.currentTime = 0;
    click.play().catch(() => {});

    setTimeout(() => {
        window.location.href = url;
    }, 140);
}

window.addEventListener("DOMContentLoaded", setupAudio);
</script>

</body>
</html>
