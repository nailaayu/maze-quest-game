<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>3D Maze Quest - Victory Screen</title>
    <style>
        :root { --gold: #ffd166; --glass: rgba(6, 14, 28, 0.75); --line: rgba(255, 255, 255, 0.18); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; font-family: 'Segoe UI', Inter, sans-serif; color: #fff; }
        body { background: #06111f url('assets/images/background.jpg') center/cover fixed no-repeat; display: grid; place-items: center; overflow: hidden; }
        body:before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 35%, rgba(34, 197, 94, 0.15), rgba(0,0,0,0.8) 75%), linear-gradient(120deg, rgba(2,6,23,.4), rgba(0,0,0,.5)); z-index: -1; }
        .panel { width: min(92vw, 500px); padding: 40px 30px; border: 1px solid var(--line); border-radius: 24px; background: var(--glass); backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); text-align: center; }
        .title { margin-bottom: 10px; font-size: 42px; font-weight: 900; letter-spacing: 1px; color: #22c55e; text-shadow: 0 0 25px rgba(34, 197, 94, 0.6); }
        .sub { color: #dbeafe; margin-bottom: 30px; font-size: 18px; line-height: 1.5; }
        #score { color: var(--gold); font-size: 26px; font-weight: 900; }
        .btn { display: block; width: 100%; padding: 16px 20px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #22c55e, #16a34a); color: white; font-size: 18px; font-weight: 900; letter-spacing: 1px; cursor: pointer; box-shadow: 0 8px 25px rgba(34, 197, 94, 0.3); transition: 0.2s; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body>

<main class="panel">
    <h1 class="title">YOU WIN!</h1>
    <p class="sub">Selamat! Kamu berhasil mengumpulkan<br><span id="score">0</span> Koin Emas!</p>
    <button class="btn" onclick="clickGo('level.html')">PLAY AGAIN</button>
</main>

<audio id="winAudio" src="assets/audio/victorysound.mp3"></audio>
<audio id="clickSound" src="assets/audio/kliktombol.mp3"></audio>

<script>
    const winAudio = document.getElementById('winAudio');
    const clickSound = document.getElementById('clickSound');
    const globalVolume = parseFloat(localStorage.getItem("mazeVolume") || "0.75");
    winAudio.volume = globalVolume;
    clickSound.volume = globalVolume;

    document.getElementById('score').textContent = localStorage.getItem('lastScore') || '0';

    function playWinSound() {
        winAudio.currentTime = 0;
        winAudio.play().catch(() => {});
        document.removeEventListener('pointerdown', playWinSound);
    }
    document.addEventListener('pointerdown', playWinSound);

    window.addEventListener('DOMContentLoaded', () => {
        winAudio.play().then(() => {
            document.removeEventListener('pointerdown', playWinSound);
        }).catch(() => {});
    });

    function clickGo(url) {
        localStorage.removeItem('lastScore');
        if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(() => {}); }
        setTimeout(() => { location.href = url; }, 150);
    }
</script>
</body>
</html>
