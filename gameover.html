<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>3D Maze Quest - Game Over</title>
    <style>
        :root { --glass: rgba(6, 14, 28, 0.70); --line: rgba(255, 255, 255, 0.18); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; font-family: Inter, system-ui, sans-serif; color: #fff; }
        body { background: #06111f url('assets/images/background.jpg') center/cover fixed no-repeat; display: grid; place-items: center; overflow: hidden; }
        body:before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at 50% 35%, rgba(239, 68, 68, 0.15), rgba(0,0,0,0.85) 75%), linear-gradient(120deg, rgba(2,6,23,.35), rgba(0,0,0,.45)); z-index: -1; }
        .panel { width: min(92vw, 500px); padding: 40px 30px; border: 1px solid var(--line); border-radius: 24px; background: var(--glass); backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0,0,0,0.6); text-align: center; }
        .title { margin-bottom: 10px; font-size: 42px; font-weight: 1000; letter-spacing: 2px; color: #ef4444; text-shadow: 0 0 28px rgba(239, 68, 68, 0.8); }
        .sub { color: #dbeafe; margin-bottom: 30px; font-size: 18px; }
        #failedReason { color: #fca5a5; font-weight: bold; }
        .btn { display: block; width: 100%; padding: 16px 20px; border: 0; border-radius: 14px; background: linear-gradient(135deg, #ef4444, #b91c1c); color: white; font-size: 18px; font-weight: 900; letter-spacing: 1px; cursor: pointer; box-shadow: 0 8px 25px rgba(239, 68, 68, 0.3); transition: .18s; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }
    </style>
</head>
<body>

<main class="panel">
    <h1 class="title">GAME OVER</h1>
    <p class="sub"><span id="failedReason">Koin tidak mencapai 10 biji!</span></p>
    <button class="btn" onclick="clickGo('level.html')">TRY AGAIN</button>
</main>

<audio id="loseAudio" src="assets/audio/gameoversound.mp3"></audio>
<audio id="clickSound" src="assets/audio/kliktombol.mp3"></audio>

<script>
    const loseAudio = document.getElementById('loseAudio');
    const clickSound = document.getElementById('clickSound');
    const volume = parseFloat(localStorage.getItem("mazeVolume") || "0.75");
    loseAudio.volume = volume;
    clickSound.volume = volume;

    const diff = localStorage.getItem("mazeDifficulty") || "mudah";
    const currentScore = parseInt(localStorage.getItem("lastScore") || "0");
    
    if (currentScore < 10) {
        document.getElementById('failedReason').textContent = "Koin kamu kurang dari 10! (" + currentScore + "/10)";
    } else {
        document.getElementById('failedReason').textContent = "Kamu kalah di tantangan mode " + diff.toUpperCase();
    }

    function playLoseSound() {
        loseAudio.currentTime = 0;
        loseAudio.play().catch(() => {});
        document.removeEventListener('pointerdown', playLoseSound);
    }
    document.addEventListener('pointerdown', playLoseSound);

    window.addEventListener('DOMContentLoaded', () => {
        loseAudio.play().then(() => {
            document.removeEventListener('pointerdown', playLoseSound);
        }).catch(() => {});
    });

    function clickGo(url) {
        localStorage.removeItem('lastScore');
        if (clickSound) { clickSound.currentTime = 0; clickSound.play().catch(() => {}); }
        setTimeout(() => location.href = url, 150);
    }
</script>
</body>
</html>
