
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

/* Background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-5;

    background:url("assets/images/background.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    filter:
        brightness(1.15)
        contrast(1.05)
        saturate(1.1);
}

/* Overlay */

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:-4;

    background:
    linear-gradient(
        rgba(0,0,0,.08),
        rgba(0,0,0,.30)
    );
}

/* Blink Effect */

.blink{
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    filter:blur(70px);
    opacity:0;
    pointer-events:none;
}

.blink1{
    top:10%;
    left:10%;
    background:rgba(56,189,248,.55);
    animation:blinkMove 4s infinite;
}

.blink2{
    right:10%;
    bottom:10%;
    background:rgba(250,204,21,.45);
    animation:blinkMove 4s infinite 1.5s;
}

.blink3{
    left:45%;
    bottom:20%;
    background:rgba(255,255,255,.20);
    animation:blinkMove 4s infinite 3s;
}

/* Content */

.content{
    width:90%;
    max-width:550px;
    text-align:center;
}

/* Loading Bar */

.progress-wrap{
    width:100%;
    height:22px;

    border-radius:999px;
    overflow:hidden;

    background:
    rgba(255,255,255,.25);

    border:
    1px solid rgba(255,255,255,.35);

    box-shadow:
    0 0 20px rgba(0,0,0,.4);
}

.progress-bar{
    width:0%;
    height:100%;

    border-radius:999px;

    background:
    linear-gradient(
        90deg,
        #38bdf8,
        #67e8f9,
        #facc15
    );

    box-shadow:
    0 0 25px rgba(56,189,248,.9);

    animation:
    barBlink 1.2s infinite;
}

/* Text */

.loading-text{

    margin-top:22px;

    font-size:24px;
    font-weight:700;
    color:white;

    letter-spacing:2px;

    text-shadow:
    0 0 10px rgba(255,255,255,.8),
    0 0 20px rgba(56,189,248,.8);

    animation:
    textBlink 1.2s ease-in-out infinite;
}

/* Animations */

@keyframes blinkMove{

    0%{
        opacity:0;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.2);
    }

    100%{
        opacity:0;
        transform:scale(.8);
    }
}

@keyframes textBlink{

    0%,100%{
        opacity:1;
    }

    50%{
        opacity:.4;
    }
}

@keyframes barBlink{

    0%,100%{
        filter:brightness(1);
    }

    50%{
        filter:brightness(1.5);
    }
}

</style>
</head>

<body>

<div class="blink blink1"></div>
<div class="blink blink2"></div>
<div class="blink blink3"></div>

<div class="content">

    <div class="progress-wrap">
        <div
            class="progress-bar"
            id="progressBar">
        </div>
    </div>

    <div
        class="loading-text"
        id="loadingText">
        Loading...
    </div>

</div>

<script>

const progressBar =
document.getElementById("progressBar");

let progress = 0;

/* 5 detik */

const duration = 5000;
const interval = 50;

const increment =
100 / (duration / interval);

const loader =
setInterval(() => {

    progress += increment;

    if(progress > 100){
        progress = 100;
    }

    progressBar.style.width =
    progress + "%";

    if(progress >= 100){

        clearInterval(loader);

        setTimeout(() => {

            window.location.href =
            "menu.html";

        },200);

    }

}, interval);

</script>

</body>
</html>
